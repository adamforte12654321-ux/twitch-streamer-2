name: Stream Rai 1

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Rai 1 Stream
        run: |
          echo "Avvio streaming Rai 1..."
          
          ffmpeg -re -i "https://dash2.antik.sk/live/test_rai_uno_tizen/playlist.m3u8" \
            -c:v libx264 -preset veryfast -r 30 -c:a aac -f flv \
            "rtmps://fa7233cb171.global-contribute.live-video.net/app/sk_us-west-2_xDwDHZj9rFKE_gZgv8AT8bgKeZb1TROOpS0dQgaqzFH"
